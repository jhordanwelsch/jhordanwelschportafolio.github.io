<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>300x600</title>
<meta name="ad.size" content="width=300,height=600">
<script type="text/javascript" src="easeljs-0.6.0.min.js"></script>
<script type="text/javascript" src="tweenjs-0.4.0.min.js"></script>
<script type="text/javascript" src="movieclip-0.6.0.min.js"></script>
<script type="text/javascript" src="preloadjs-0.3.0.min.js"></script>
<script src="300x600.js"></script>

<script>
var canvas, stage, exportRoot;

function init() {
	canvas = document.getElementById("canvas");
	images = images||{};

	var manifest = [
		{src:"images/_160x600plumon.png", id:"_160x600plumon"},
		{src:"images/_300x600fondo.jpg", id:"_300x600fondo"},
		{src:"images/_336x280fondo2.jpg", id:"_336x280fondo2"},
		{src:"images/_336x280parentesis.png", id:"_336x280parentesis"},
		{src:"images/_336x280tarjetas.png", id:"_336x280tarjetas"},
		{src:"images/_336x280x2.png", id:"_336x280x2"}
	];

	var loader = new createjs.LoadQueue(false);
	loader.addEventListener("fileload", handleFileLoad);
	loader.addEventListener("complete", handleComplete);
	loader.loadManifest(manifest);

	reloadAd();
}

function handleFileLoad(evt) {
	if (evt.item.type == "image") { images[evt.item.id] = evt.result; }
}

function handleComplete() {
	exportRoot = new lib._300x600();

	stage = new createjs.Stage(canvas);
	stage.addChild(exportRoot);
	stage.update();

	createjs.Ticker.setFPS(24);
	createjs.Ticker.addEventListener("tick", stage);
}
</script>
<style type="text/css">
	#reload{position: absolute; top: 14px; right: 5px; cursor: pointer; display: none;}
	.contenedor{position: relative; width: 300px}
</style>
</head>

<body onload="init();" style="background-color:#fff" topmargin="0" leftmargin="0">
<div class="contenedor">
<div id="reload"><img src="images/reload.png" onclick="init();"></div>
	<canvas id="canvas" width="300" height="600" style="background-color:#ffffff;"></canvas>
</div>
</body>
</html>
